<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 225" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Himalayan Astrometry and Celestial Horizon">
  <title>Himalayan Astrometry and Celestial Horizon</title>

  <defs>
    <!-- Deep Space Astrometry Void -->
    <linearGradient id="sky-void" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010207"/>
      <stop offset="42%" stop-color="#050a17"/>
      <stop offset="78%" stop-color="#0c162a"/>
      <stop offset="100%" stop-color="#152038"/>
    </linearGradient>

    <!-- Deep Cosmic Nebula Glows -->
    <radialGradient id="nebula-cyan" cx="36%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-violet" cx="80%" cy="65%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.07"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Harmonic Multi-Spectral Aurora Shimmer -->
    <linearGradient id="aurora-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.08"/>
      <stop offset="75%" stop-color="#2dd4bf" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Astrometric Coordinate Trace Glow -->
    <linearGradient id="declination-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Astrometric Reticle Ring Glow -->
    <linearGradient id="reticle-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Horizon Hairline Vector -->
    <linearGradient id="horizon-grid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Roerich "Star of the Hero" Gold Radiant Halo -->
    <radialGradient id="hero-gold-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drifting Valley Cloud Sea / Mist -->
    <linearGradient id="valley-mist" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.01"/>
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Meteor Ionization Trails -->
    <linearGradient id="meteor-trail-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="meteor-trail-amber" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky Canvas & Nebulae -->
  <rect width="900" height="225" fill="url(#sky-void)"/>
  <rect width="900" height="225" fill="url(#nebula-cyan)"/>
  <rect width="900" height="225" fill="url(#nebula-violet)"/>

  <!-- Harmonic Fluid Aurora Wave (18s Soft Oscillation) -->
  <path d="M -120,20 Q 220,55 480,18 T 1020,30 L 1020,88 Q 720,48 420,88 T -120,62 Z" fill="url(#aurora-wave)">
    <animateTransform attributeName="transform" type="translate" values="-35,0; 35,0; -35,0" dur="18s" repeatCount="indefinite"/>
  </path>

  <!-- RA (Right Ascension) Tick Marks (top border telemetry) -->
  <g stroke="#38bdf8" stroke-width="0.7" opacity="0.18">
    <line x1="90"  y1="10" x2="90"  y2="18"/>
    <line x1="210" y1="10" x2="210" y2="15"/>
    <line x1="330" y1="10" x2="330" y2="18"/>
    <line x1="450" y1="10" x2="450" y2="15"/>
    <line x1="570" y1="10" x2="570" y2="18"/>
    <line x1="690" y1="10" x2="690" y2="15"/>
    <line x1="810" y1="10" x2="810" y2="18"/>
  </g>

  <!-- Astrometric Declination Arc & Coordinate Ties -->
  <g opacity="0.45">
    <path d="M 60 115 Q 450 -18 840 115" stroke="url(#declination-arc)" stroke-width="0.8" stroke-dasharray="3 6" fill="none"/>
    <circle cx="195" cy="62" r="1.2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="330" cy="32" r="1.3" fill="#818cf8" opacity="0.9"/>
    <circle cx="570" cy="32" r="1.3" fill="#818cf8" opacity="0.9"/>
    <circle cx="705" cy="62" r="1.2" fill="#38bdf8" opacity="0.8"/>
    <line x1="195" y1="62" x2="330" y2="32" stroke="#818cf8" stroke-width="0.5" opacity="0.35"/>
    <line x1="570" y1="32" x2="705" y2="62" stroke="#818cf8" stroke-width="0.5" opacity="0.35"/>
  </g>

  <!-- Horizon Latitude Vector Line -->
  <line x1="30" y1="38" x2="870" y2="38" stroke="url(#horizon-grid)" stroke-width="0.6" stroke-dasharray="1 8"/>

  <!-- Asynchronous Micro-Starfield (Organic Twinkle) -->
  <g>
    <circle cx="75"  cy="28" r="0.7" fill="#f8fafc" opacity="0.35"/>
    <circle cx="120" cy="74" r="0.9" fill="#7dd3fc">
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="50" r="1.0" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="22" r="0.8" fill="#f8fafc" opacity="0.4"/>
    <circle cx="285" cy="68" r="0.6" fill="#f8fafc" opacity="0.25"/>
    <circle cx="360" cy="20" r="1.0" fill="#fef08a">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="26" r="0.6" fill="#f8fafc" opacity="0.3"/>
    <circle cx="510" cy="24" r="0.9" fill="#7dd3fc">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="66" r="0.7" fill="#f8fafc" opacity="0.3"/>
    <circle cx="635" cy="56" r="0.8" fill="#f8fafc" opacity="0.35"/>
    <circle cx="680" cy="85" r="0.6" fill="#f8fafc" opacity="0.22"/>
    <circle cx="825" cy="20" r="1.1" fill="#fef08a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="865" cy="54" r="0.7" fill="#f8fafc" opacity="0.35"/>
  </g>

  <!-- Physics-timed Shooting Star 1 (Fast Ion Streak, upper-left field, 9s cycle) -->
  <g opacity="0">
    <line x1="-70" y1="-18" x2="0" y2="0" stroke="url(#meteor-trail-cyan)" stroke-width="1.5" stroke-linecap="round"/>
    <circle r="1.6" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" values="100,-8; 530,122; 530,122" keyTimes="0;0.055;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.015;0.055;1" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- Physics-timed Shooting Star 2 (Warm Arc from upper-right, 13s cycle) -->
  <g opacity="0">
    <line x1="62" y1="-16" x2="0" y2="0" stroke="url(#meteor-trail-amber)" stroke-width="1.3" stroke-linecap="round"/>
    <circle r="1.4" fill="#fef9ec"/>
    <animateTransform attributeName="transform" type="translate" values="875,12; 610,94; 610,94" keyTimes="0;0.065;1" dur="13s" begin="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.018;0.065;1" dur="13s" begin="4.5s" repeatCount="indefinite"/>
  </g>

  <!-- Astrometric Polar Reticle & Roerich "Star of the Hero" Core (742, 54) -->
  <g transform="translate(742, 54)">
    <!-- Rotating Coordinate Ring (85s Slow Orbit) -->
    <circle r="44" stroke="url(#reticle-glow)" stroke-width="0.8" fill="none" stroke-dasharray="2 5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="85s" repeatCount="indefinite"/>
    </circle>
    <circle r="25" stroke="#38bdf8" stroke-width="0.6" opacity="0.32" fill="none"/>
    <line x1="-52" y1="0" x2="52" y2="0" stroke="url(#horizon-grid)" stroke-width="0.7"/>
    <line x1="0" y1="-52" x2="0" y2="52" stroke="url(#horizon-grid)" stroke-width="0.7"/>

    <!-- Radiant Breathing Gold Halo -->
    <circle r="20" fill="url(#hero-gold-halo)">
      <animate attributeName="r" values="17;24;17" dur="3.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer Diamond Rays (Breathing Pulse) -->
    <g stroke="#f59e0b" stroke-linecap="round">
      <line x1="-28" y1="0" x2="-12" y2="0" stroke-width="0.9">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite"/>
      </line>
      <line x1="12" y1="0" x2="28" y2="0" stroke-width="0.9">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="-28" x2="0" y2="-12" stroke-width="0.9">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" begin="1.9s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="12" x2="0" y2="28" stroke-width="0.9">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" begin="1.9s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Inner 4-Point Golden Star -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3.8s" repeatCount="indefinite"/>
      <polygon points="0,-17 3,0 0,17 -3,0" fill="#f59e0b" opacity="0.9"/>
      <polygon points="-17,0 0,3 17,0 0,-3" fill="#f59e0b" opacity="0.9"/>
    </g>

    <!-- Rotating Silver Inner Cross (24s cycle) -->
    <g>
      <polygon points="0,-9 2,0 0,9 -2,0" fill="#ffffff" opacity="0.95"/>
      <polygon points="-9,0 0,2 9,0 0,-2" fill="#ffffff" opacity="0.95"/>
      <animateTransform attributeName="transform" type="rotate" values="0; 90; 180; 270; 360" dur="24s" repeatCount="indefinite"/>
    </g>

    <!-- Hot Photon Node -->
    <circle r="2.6" fill="#ffffff">
      <animate attributeName="r" values="2.0;3.1;2.0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Distant Himalayan Peaks Silhouette (Downlink Massif) -->
  <polygon points="-20,225 60,146 140,168 240,124 350,162 470,118 590,156 720,114 850,164 920,142 920,225" fill="#18253e" opacity="0.55"/>
  <polygon points="-20,225 80,162 170,182 280,136 390,172 510,130 630,166 760,124 880,172 920,152 920,225" fill="#1b2842" opacity="0.75"/>

  <!-- Crystalline Faceted Shadow Planes (Roerich Nocturnal Lapis & Deep Indigo) -->
  <polygon points="80,162 170,182 280,136 220,225 120,225" fill="#1e3a8a" opacity="0.32"/>
  <polygon points="280,136 390,172 510,130 440,225 320,225" fill="#0f172a" opacity="0.48"/>
  <polygon points="510,130 630,166 760,124 680,225 560,225" fill="#1e3a8a" opacity="0.36"/>
  <polygon points="760,124 880,172 920,152 920,225 790,225" fill="#1e1b4b" opacity="0.42"/>

  <!-- Glacial Summit Starlight Glint (Highest Crest: 510, 130) -->
  <circle cx="510" cy="130" r="1.6" fill="#ffffff">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.2;2.3;1.2" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Drifting Valley Cloud Sea / High-Altitude Mist (18s Lateral Loop) -->
  <g>
    <path d="M -40 180 Q 150 170 300 180 T 600 174 T 960 180 L 960 225 L -40 225 Z" fill="url(#valley-mist)"/>
    <animateTransform attributeName="transform" type="translate" values="-26,0; 26,0; -26,0" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- Mid-Ground Ridges (Obsidian & Deep Lapis Facets) -->
  <polygon points="-20,225 120,166 260,192 420,152 580,186 730,146 870,182 920,166 920,225" fill="#0b1220"/>
  <polygon points="-20,225 60,186 190,206 310,172 460,206 610,166 780,206 920,182 920,225" fill="#080c16"/>

  <!-- Foreground Deep Basalt Silhouette -->
  <polygon points="-20,225 150,202 290,212 450,192 620,208 790,194 920,206 920,225" fill="#020408"/>
</svg>
