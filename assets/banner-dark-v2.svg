<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 225" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ripuranjan Baruah — Founder, Researcher">
  <title>Ripuranjan Baruah — Founder, Researcher</title>

  <defs>
    <!-- Deep Space Astrometry Void -->
    <linearGradient id="d2-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010208"/>
      <stop offset="50%" stop-color="#050a15"/>
      <stop offset="85%" stop-color="#0b1425"/>
      <stop offset="100%" stop-color="#131e35"/>
    </linearGradient>

    <!-- Nebula Glows -->
    <radialGradient id="d2-nebula-a" cx="38%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d2-nebula-b" cx="82%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Reticle Ring Glow -->
    <linearGradient id="d2-ring-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Fading Grid Lines -->
    <linearGradient id="d2-grid-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Meteor Trails (directional) -->
    <linearGradient id="d2-trail-r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="d2-trail-l" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Hero Star Halo -->
    <radialGradient id="d2-star-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1cf" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#f5c97a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f5c97a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Canvas & Nebulae -->
  <rect width="900" height="225" fill="url(#d2-sky)"/>
  <rect width="900" height="225" fill="url(#d2-nebula-a)"/>
  <rect width="900" height="225" fill="url(#d2-nebula-b)"/>

  <!-- RA Tick Marks (top edge) -->
  <g stroke="#38bdf8" stroke-width="0.7" opacity="0.18">
    <line x1="90"  y1="12" x2="90"  y2="20"/>
    <line x1="210" y1="12" x2="210" y2="17"/>
    <line x1="330" y1="12" x2="330" y2="20"/>
    <line x1="450" y1="12" x2="450" y2="17"/>
    <line x1="570" y1="12" x2="570" y2="20"/>
    <line x1="690" y1="12" x2="690" y2="17"/>
    <line x1="810" y1="12" x2="810" y2="20"/>
  </g>

  <!-- Astrometric Polar Reticle — Roerich "Star of the Hero" gold core -->
  <g transform="translate(742, 46)">
    <circle r="34" stroke="url(#d2-ring-glow)" stroke-width="0.8" fill="none" stroke-dasharray="2 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
    </circle>
    <circle r="19" stroke="#38bdf8" stroke-width="0.6" opacity="0.3" fill="none"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="url(#d2-grid-line)" stroke-width="0.7"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="url(#d2-grid-line)" stroke-width="0.7"/>

    <!-- Hero Star: breathing halo + pulsing diffraction spikes + shimmering core -->
    <circle r="16" fill="url(#d2-star-halo)">
      <animate attributeName="r" values="14;19;14" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#f5c97a" stroke-linecap="round">
      <line x1="-22" y1="0" x2="-9" y2="0" stroke-width="0.9">
        <animate attributeName="opacity" values="0.25;0.85;0.25" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="9" y1="0" x2="22" y2="0" stroke-width="0.9">
        <animate attributeName="opacity" values="0.25;0.85;0.25" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="-22" x2="0" y2="-9" stroke-width="0.9">
        <animate attributeName="opacity" values="0.25;0.85;0.25" dur="4s" begin="2s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="9" x2="0" y2="22" stroke-width="0.9">
        <animate attributeName="opacity" values="0.25;0.85;0.25" dur="4s" begin="2s" repeatCount="indefinite"/>
      </line>
    </g>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.09;1" dur="4s" repeatCount="indefinite"/>
      <polygon points="0,-13 2.2,0 0,13 -2.2,0" fill="#f0b54e" opacity="0.9"/>
      <polygon points="-13,0 0,2.2 13,0 0,-2.2" fill="#f0b54e" opacity="0.9"/>
    </g>
    <circle r="2.4" fill="#fff1cf">
      <animate attributeName="fill" values="#fff1cf;#ffffff;#fff1cf" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Horizon Latitude Vector Line -->
  <line x1="40" y1="35" x2="860" y2="35" stroke="url(#d2-grid-line)" stroke-width="0.6" stroke-dasharray="1 8"/>

  <!-- Multi-Tone Telemetry Starfield -->
  <g>
    <circle cx="80"  cy="25" r="0.7" fill="#f8fafc" opacity="0.3"/>
    <circle cx="128" cy="72" r="0.6" fill="#f8fafc" opacity="0.25"/>
    <circle cx="150" cy="55" r="1.0" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="20" r="0.7" fill="#f8fafc" opacity="0.4"/>
    <circle cx="296" cy="66" r="0.6" fill="#f8fafc" opacity="0.22"/>
    <circle cx="330" cy="48" r="1.1" fill="#fef08a">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="418" cy="24" r="0.6" fill="#f8fafc" opacity="0.3"/>
    <circle cx="520" cy="28" r="0.9" fill="#38bdf8">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="3.5s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="586" cy="64" r="0.6" fill="#f8fafc" opacity="0.25"/>
    <circle cx="610" cy="60" r="0.8" fill="#f8fafc" opacity="0.35"/>
    <circle cx="700" cy="88" r="0.6" fill="#f8fafc" opacity="0.2"/>
    <circle cx="830" cy="22" r="1.1" fill="#fef08a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="862" cy="58" r="0.7" fill="#f8fafc" opacity="0.3"/>
  </g>

  <!-- Shooting Star (fast streak, upper-left field, every ~9 s) -->
  <g opacity="0">
    <line x1="-64" y1="-16" x2="0" y2="0" stroke="url(#d2-trail-r)" stroke-width="1.4" stroke-linecap="round"/>
    <circle r="1.6" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" values="120,-6; 520,118; 520,118" keyTimes="0;0.055;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.015;0.055;1" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- Shooting Star (warmer, shorter arc from the right, every ~13 s) -->
  <g opacity="0">
    <line x1="58" y1="-15" x2="0" y2="0" stroke="url(#d2-trail-l)" stroke-width="1.2" stroke-linecap="round"/>
    <circle r="1.4" fill="#fef9ec"/>
    <animateTransform attributeName="transform" type="translate" values="880,14; 600,96; 600,96" keyTimes="0;0.07;1" dur="13s" begin="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.02;0.07;1" dur="13s" begin="5s" repeatCount="indefinite"/>
  </g>

  <!-- Satellite Pass (slow, steady, every ~21 s) -->
  <g opacity="0">
    <line x1="-46" y1="0" x2="0" y2="0" stroke="url(#d2-trail-r)" stroke-width="1.1" stroke-linecap="round"/>
    <circle r="1.3" fill="#f0f9ff"/>
    <animateTransform attributeName="transform" type="translate" values="-80,52; 980,140; 980,140" keyTimes="0;0.09;1" dur="21s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0;0" keyTimes="0;0.04;0.09;1" dur="21s" begin="2.5s" repeatCount="indefinite"/>
  </g>

  <!-- Distant Himalayan Silhouettes (Downlink Horizon) -->
  <polygon points="-20,225 80,165 170,185 280,140 390,175 510,135 630,170 760,130 880,175 920,155 920,225" fill="#1e293b" opacity="0.65"/>
  <polygon points="80,165 170,185 280,140 220,225 120,225" fill="#0284c7" opacity="0.2"/>
  <polygon points="280,140 390,175 510,135 440,225 320,225" fill="#0369a1" opacity="0.25"/>
  <polygon points="510,135 630,170 760,130 680,225 560,225" fill="#0284c7" opacity="0.22"/>

  <!-- Mid-Ground Ridges -->
  <polygon points="-20,225 120,170 260,195 420,155 580,190 730,150 870,185 920,170 920,225" fill="#0f172a"/>
  <polygon points="-20,225 60,190 190,210 310,175 460,210 610,170 780,210 920,185 920,225" fill="#090d16"/>

  <!-- Foreground Silhouette -->
  <polygon points="-20,225 150,205 290,215 450,195 620,212 790,198 920,210 920,225" fill="#020408"/>

  <!-- Typography (dx = letter-spacing / 2 compensates trailing tracking so text centers true) -->
  <text x="450" y="92" dx="6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Inter, system-ui, sans-serif" font-size="36" font-weight="600" letter-spacing="12" fill="#f8fafc" text-anchor="middle">RIPURANJAN BARUAH</text>
  <text x="450" y="126" dx="4" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="500" letter-spacing="8" fill="#94a3b8" text-anchor="middle">FOUNDER · RESEARCHER</text>
</svg>
