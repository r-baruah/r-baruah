<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 225" width="100%" height="100%" role="img" aria-label="Ripuranjan Baruah — Founder, Researcher">
  <defs>
    <!-- Deep Space Astrometry Void -->
    <linearGradient id="astrometry-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020307"/>
      <stop offset="50%" stop-color="#060b17"/>
      <stop offset="85%" stop-color="#0c1527"/>
      <stop offset="100%" stop-color="#141f36"/>
    </linearGradient>

    <!-- Deep Nebula Glow -->
    <radialGradient id="nebula-glow" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Astrometric Coordinate Rings -->
    <linearGradient id="ring-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Polar Coordinate Grid Markers -->
    <linearGradient id="grid-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky Canvas & Nebula -->
  <rect width="900" height="225" fill="url(#astrometry-sky)"/>
  <rect width="900" height="225" fill="url(#nebula-glow)"/>

  <!-- Astrometric Polar Grids & Rings -->
  <g transform="translate(730, 42)">
    <circle cx="0" cy="0" r="32" stroke="url(#ring-glow)" stroke-width="0.8" fill="none" stroke-dasharray="2 4"/>
    <circle cx="0" cy="0" r="18" stroke="#38bdf8" stroke-width="0.6" opacity="0.3" fill="none"/>
    <line x1="-38" y1="0" x2="38" y2="0" stroke="url(#grid-line)" stroke-width="0.7"/>
    <line x1="0" y1="-38" x2="0" y2="38" stroke="url(#grid-line)" stroke-width="0.7"/>
    <!-- Celestial Target Indicator — Roerich "Star of the Hero" gold -->
    <circle cx="0" cy="0" r="9" fill="#f5c97a" opacity="0.18"/><circle cx="0" cy="0" r="2.4" fill="#fff1cf"/>
    <polygon points="0,-13 2.2,0 0,13 -2.2,0" fill="#f0b54e" opacity="0.9"/>
    <polygon points="-13,0 0,2.2 13,0 0,-2.2" fill="#f0b54e" opacity="0.9"/>
  </g>

  <!-- Horizon Astrometric Latitude Vector Line -->
  <line x1="40" y1="35" x2="860" y2="35" stroke="url(#grid-line)" stroke-width="0.6" stroke-dasharray="1 8"/>

  <!-- Multi-Tone Telemetry Starfield -->
  <g>
    <circle cx="80" cy="25" r="0.7" fill="#f8fafc" opacity="0.3"/>
    <circle cx="150" cy="55" r="1.0" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="20" r="0.7" fill="#f8fafc" opacity="0.4"/>
    <circle cx="330" cy="48" r="1.1" fill="#fef08a">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="28" r="0.9" fill="#38bdf8">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="60" r="0.8" fill="#f8fafc" opacity="0.35"/>
    <circle cx="830" cy="22" r="1.1" fill="#fef08a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Distant Himalayan Mountain Silhouettes (Downlink Horizon) -->
  <polygon points="-20,225 80,165 170,185 280,140 390,175 510,135 630,170 760,130 880,175 920,155 920,225" fill="#1e293b" opacity="0.65"/>
  <polygon points="80,165 170,185 280,140 220,225 120,225" fill="#0284c7" opacity="0.2"/>
  <polygon points="280,140 390,175 510,135 440,225 320,225" fill="#0369a1" opacity="0.25"/>
  <polygon points="510,135 630,170 760,130 680,225 560,225" fill="#0284c7" opacity="0.22"/>

  <!-- Mid-Ground Ridges -->
  <polygon points="-20,225 120,170 260,195 420,155 580,190 730,150 870,185 920,170 920,225" fill="#0f172a"/>
  <polygon points="-20,225 60,190 190,210 310,175 460,210 610,170 780,210 920,185 920,225" fill="#090d16"/>

  <!-- Foreground Silhouette -->
  <polygon points="-20,225 150,205 290,215 450,195 620,212 790,198 920,210 920,225" fill="#020408"/>

  <!-- Typography -->
  <text x="450" y="88" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="35" font-weight="600" letter-spacing="12" fill="#f8fafc" text-anchor="middle">RIPURANJAN BARUAH</text>
  <text x="450" y="122" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', monospace" font-size="13" font-weight="500" letter-spacing="8" fill="#94a3b8" text-anchor="middle">FOUNDER · RESEARCHER</text>
</svg>
