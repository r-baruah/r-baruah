<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 225" width="100%" height="100%">
  <defs>
    <!-- Roerich High-Altitude Daylight Sky -->
    <linearGradient id="himalaya-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Translucent Cloud Layer -->
    <linearGradient id="cloud-sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Canvas (4:1) -->
  <rect width="900" height="225" fill="url(#himalaya-sky)"/>

  <!-- High Atmosphere Subtle Cirrus Line -->
  <path d="M 0 40 Q 250 35 500 45 T 900 38" stroke="#ffffff" stroke-width="1.2" opacity="0.6" fill="none"/>

  <!-- Distant Snow Peaks (Pushed Low to Avoid Text Collision) -->
  <!-- Kanchenjunga Main Ridge (Sunlit Snow & Lapis Shadow) -->
  <polygon points="-20,225 80,165 170,185 280,140 390,175 510,135 630,170 760,130 880,175 920,155 920,225" fill="#f1f5f9"/>
  <polygon points="80,165 170,185 280,140 220,225 120,225" fill="#3b82f6" opacity="0.15"/>
  <polygon points="280,140 390,175 510,135 440,225 320,225" fill="#1d4ed8" opacity="0.2"/>
  <polygon points="510,135 630,170 760,130 680,225 560,225" fill="#2563eb" opacity="0.18"/>

  <!-- Mid-Ground Ridges (Deep Blue & Ochre Facets) -->
  <polygon points="-20,225 120,170 260,195 420,155 580,190 730,150 870,185 920,170 920,225" fill="#2b5c8f"/>
  <polygon points="-20,225 60,190 190,210 310,175 460,210 610,170 780,210 920,185 920,225" fill="#8c4a3e" opacity="0.85"/>

  <!-- Roerich Mist / Valley Cloud Sea (Covers Lower Mountain Base) -->
  <path d="M -20 185 Q 150 175 300 185 T 600 180 T 920 185 L 920 225 L -20 225 Z" fill="url(#cloud-sea)"/>

  <!-- Foreground Deep Earth Silhouette -->
  <polygon points="-20,225 150,205 290,215 450,195 620,212 790,198 920,210 920,225" fill="#0f172a"/>

  <!-- Header Text (Unobstructed in Upper Sky Zone) -->
  <text x="450" y="88" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="35" font-weight="600" letter-spacing="12" fill="#0f172a" text-anchor="middle">RIPURANJAN BARUAH</text>

  <!-- Subtitle Tag -->
  <text x="450" y="122" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', monospace" font-size="13" font-weight="500" letter-spacing="8" fill="#475569" text-anchor="middle">FOUNDER · RESEARCHER</text>
</svg>